name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build DwarfNina.sln -c Release

      - name: Package plugin and probe tool
        shell: pwsh
        run: |
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path "$out/DWARF" | Out-Null
          $bin = "src/NINA.Plugin.Dwarf/bin/Release/net8.0-windows"
          # NINA already ships Google.Protobuf and its own assemblies: copy only what the plugin adds.
          foreach ($f in "DWARF.NINA.Plugin.dll", "Dwarf.Core.dll", "FluentFTP.dll") {
            Copy-Item "$bin/$f" "$out/DWARF/"
          }
          Copy-Item LICENSE "$out/DWARF/LICENSE.txt"
          Compress-Archive -Path "$out/DWARF" -DestinationPath "$out/DWARF-NINA-Plugin.zip" -Force

          dotnet publish tools/DwarfProbe -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o "$out/probe"
          Compress-Archive -Path "$out/probe/DwarfProbe.exe" -DestinationPath "$out/DwarfProbe.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DWARF-NINA-Plugin
          path: |
            artifacts/DWARF-NINA-Plugin.zip
            artifacts/DwarfProbe.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/DWARF-NINA-Plugin.zip artifacts/DwarfProbe.zip `
            --title "DWARF NINA Plugin ${{ github.ref_name }}" --generate-notes --prerelease
